name: Publicar Xetup en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio público
        run: |
          mkdir -p _site
          cp index.html styles.css script.js _site/
          mkdir -p _site/assets
          # Release archives are build inputs, not public catalog assets.
          tar -C assets --exclude='bunner-web-*.zip' -cf - . | tar -C _site/assets -xf -
          mkdir -p _site/bunner
          unzip -q assets/bunner-web-v27.zip -d _site/bunner
          unzip -qo assets/bunner-web-v28-update.zip -d _site/bunner
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
